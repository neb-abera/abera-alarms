name: CodeQL

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: "30 6 * * 1"

# Outside a pull request each commit gets its own group. See ci.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # CodeQL's Swift tracer fails on the xcode-27 preview image
          # ("Bad CPU type in executable"), so Swift is analysed on the GA
          # macos-26 image with its newest Xcode. Move it to .xcode-version
          # when xcode-27 is GA and the tracer runs there.
          - language: swift
            runner: macos-26
            build-mode: manual
            xcode: "26.6"
          - language: actions
            runner: ubuntu-26.04
            build-mode: none

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: select Xcode
        if: matrix.language == 'swift'
        env:
          XCODE_VERSION: ${{ matrix.xcode }}
        run: scripts/select-xcode.sh

      - name: initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: build the app for the simulator
        if: matrix.language == 'swift'
        run: >-
          xcodebuild build -project AberaAlarms.xcodeproj -scheme AberaAlarms
          -destination 'generic/platform=iOS Simulator' -derivedDataPath build/DerivedData
          CODE_SIGNING_ALLOWED=NO

      - name: perform CodeQL analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:${{ matrix.language }}"
