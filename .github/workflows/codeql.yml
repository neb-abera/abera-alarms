name: CodeQL

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: "30 6 * * 1"

# Outside a pull request each commit gets its own group. See ci.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: swift
            runner: xcode-27
            build-mode: manual
          - language: actions
            runner: ubuntu-26.04
            build-mode: none

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: select the pinned Xcode
        if: matrix.language == 'swift'
        run: scripts/select-xcode.sh

      - name: initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: build the app for the simulator
        if: matrix.language == 'swift'
        run: >-
          xcodebuild build -project AberaAlarms.xcodeproj -scheme AberaAlarms
          -destination 'generic/platform=iOS Simulator' -derivedDataPath build/DerivedData
          CODE_SIGNING_ALLOWED=NO

      - name: perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
