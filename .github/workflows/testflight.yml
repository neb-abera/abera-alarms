name: TestFlight

# Every pull request builds the Release archive, unsigned, so a change that
# breaks the Release build is caught before it merges. Every merge to main
# signs that archive with the App Store Connect API key and uploads it, and
# TestFlight offers it on Neb's iPhone once Apple has processed it.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]

# Outside a pull request each commit gets its own group. See ci.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  release:
    name: release (archive, and upload from main)
    # The runner with Xcode 27, as the CI job that tests on it.
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      # harden-runner supports Linux runners only.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Xcode that .xcode-version names. Xcode 27 (27A266a) is Apple's
      # release of 14 September 2026. GitHub lists its install on the image as
      # a preview, and App Store Connect judges the Xcode, not the image.
      # Built with Xcode 26.6, build 218 drew App Store Connect's warning that
      # apps need the iOS 27 SDK from April 2027.
      - name: select Xcode
        run: scripts/select-xcode.sh

      # Signing on a fresh runner makes a development certificate, and Apple
      # caps how many an account holds. Revoke the ones runs left behind,
      # then note which exist, so the step after the upload revokes the one
      # this run made. scripts/asc-certificates.mjs says how it chooses.
      - name: revoke development certificates earlier runs left
        if: github.event_name != 'pull_request'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          node scripts/asc-certificates.mjs clean --older-than-hours 2
          node scripts/asc-certificates.mjs snapshot "$RUNNER_TEMP/certificates.json"

      - name: archive the Release build (signed on main)
        env:
          ASC_KEY_ID: ${{ github.event_name != 'pull_request' && secrets.ASC_KEY_ID || '' }}
          ASC_ISSUER_ID: ${{ github.event_name != 'pull_request' && secrets.ASC_ISSUER_ID || '' }}
          ASC_KEY_P8: ${{ github.event_name != 'pull_request' && secrets.ASC_KEY_P8 || '' }}
        run: scripts/release.sh archive

      - name: upload to TestFlight
        if: github.event_name != 'pull_request'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: scripts/release.sh upload

      - name: revoke the development certificate this run made
        if: always() && github.event_name != 'pull_request'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          # No snapshot: the step that takes it failed, and the job is red already.
          if [ -f "$RUNNER_TEMP/certificates.json" ]; then
            node scripts/asc-certificates.mjs clean --not-in "$RUNNER_TEMP/certificates.json"
          fi
